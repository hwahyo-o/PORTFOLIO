<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Ye Hyun Portfolio</title>

    <meta
      name="description"
      content="Yang Ye Hyun's visual design portfolio featuring UX/UI, graphic design, video, and creative projects."
    />

    <meta name="author" content="Yang Ye Hyun" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://hwahyo-o.github.io/PORTFOLIO/" />

    <!-- Social sharing -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Yang Ye Hyun | Visual Designer Portfolio"
    />
    <meta
      property="og:description"
      content="UX/UI, graphic design, video, and creative projects by visual designer Yang Ye Hyun."
    />
    <meta property="og:url" content="https://hwahyo-o.github.io/PORTFOLIO/" />
    <meta property="og:site_name" content="Yang Ye Hyun Portfolio" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#ffffff" />

    <!--
      GitHub Pages에서는 서버 응답 헤더를 직접 제어하기 어렵기 때문에
      문서 수준에서 적용 가능한 CSP만 meta로 유지합니다.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https://yehyun-portfolio-api.ajas03974.workers.dev; media-src 'self' https://yehyun-portfolio-api.ajas03974.workers.dev; connect-src 'self' https://yehyun-portfolio-api.ajas03974.workers.dev;"
    />

    <link rel="icon" href="img/favicon-96x96.png" type="image/png" />

    <!-- CDN connection warm-up -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net" />

    <!--
      Wanted Sans: 공식 문서의 variable split 웹폰트.
      CSS @import보다 HTML에서 먼저 발견하게 해 초기 폰트 준비 시간을 줄입니다.
    -->
    <link
      rel="preload"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css"
    />
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css"
    />

    <!-- Bootstrap: CSS 1회만 로드 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Custom CSS: Bootstrap 뒤에서 로드하여 프로젝트 스타일을 우선 -->
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="is-loading">
    <!-- #로딩 스크린 영역 // start -->
    <div class="loading-wrap">
      <div id="loader">
        <div class="loader-content">
          <div class="title-row" aria-label="Portfolio 2026">
            <!-- portfolio에 하이라이트 컨테이너 감싸기 -->
            <span class="highlight-container">
              <span id="portfolio-word">PORTFOLIO</span>
            </span>
            <span id="year-word">2026</span>
          </div>
          <div class="subtitle-row">
            <p>Yang Ye Hyun</p>
            <div aria-label="line"></div>
            <p>visual designer / portfolio</p>
          </div>
        </div>
      </div>
    </div>
    <!-- #로딩 스크린 영역 // end -->

    <!-- #main web site 영역 // start -->
    <div id="main-content">
      <!-- #header // start -->
      <header class="gnb">
        <!-- 로고 -->
        <button class="logo-btn" date-round="main" aria-label="YeHyun home">
          <a href="index.html">
            <img
              src="img/yehyun_logo.png"
              alt="yehyun portfolio logo"
              decoding="async"
            />
          </a>
        </button>

        <!-- gnb menu -->
        <nav aria-label="Portfolio categories">
          <button><a href="ux/ui.html">UX/UI</a></button>
          <button><a href="graphic.html">Graphic</a></button>
          <button><a href="video.html">Video</a></button>
          <button><a href="#community">Community</a></button>
          <button><a href="#contact">Contact</a></button>
        </nav>

        <!-- gnb tools -->
        <div class="gnb-tool" aria-label="Site tools">
          <button
            class="gnb-tool"
            id="theme-toggle"
            data-action="toggle-theme"
            aria-label="Toggle light/dark theme"
          >
            <i class="bi bi-sun" aria-hidden="true"></i>
          </button>
          <button
            class="gnb-tool gnb-admin-tool"
            id="admin-login-btn"
            data-action="admin-login"
            aria-label="Admin login"
          >
            <i class="bi bi-lock" aria-hidden="true"></i>
          </button>

          <!-- admin session tools -->
          <div class="admin-session-tools" id="admin-session-tools" hidden>
            <button
              class="gnb-tool notification-tool"
              data-action="notifications"
              aria-label="알림 센터"
            >
              <i class="bi bi-bell" aria-hidden="true"></i
              ><span class="notification-count" id="notification-count" hidden
                >0</span
              >
            </button>
            <button class="gnb-tool" data-action="settings">
              <i class="bi bi-gear" aria-hidden="true"></i
              ><span class="visually-hidden">설정</span>
            </button>
            <button class="gnb-tool" data-action="admin-logout">
              로그아웃
            </button>
          </div>
          <!-- admin session tools end -->
        </div>
        <!-- gnb tools end -->

        <div class="notification-center" id="notification-center" hidden>
          <div class="notification-center-heading">
            <strong>알림 센터</strong
            ><button
              class="btn-close"
              data-action="close-notifications"
              aria-label="알림 닫기"
              type="button"
            ></button>
          </div>
          <ol class="notification-list" id="notification-list">
            <li class="empty-state">알림을 불러오는 중입니다.</li>
          </ol>
        </div>
      </header>
      <!-- #header // end -->

      <!-- 실제 포트폴리오 콘텐츠를 이 main 안에 정적 HTML로 배치하면 SEO에 가장 유리합니다. -->
      <!-- #main // start -->
      <div id="main"></div>
      <!-- #main // end -->

      <!-- #footer // start -->
      <div id="footer"></div>
      <!-- #footer // end -->
    </div>
    <!-- #main web site 영역 // end -->

    <!-- ============================= -->
    <!--
      Bootstrap은 defer로 내려받고, 인트로 JS는 body 끝에서 즉시 실행합니다.
      따라서 Bootstrap CDN 응답을 기다리지 않고 로딩 애니메이션을 시작할 수 있습니다.
    -->
    <!-- #bootsrtap script // start -->
    <!-- #bootsrtap script // end -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>


    <!-- index.js -->
    <script src="./src/index.js"></script>

    
  </body>
</html>
