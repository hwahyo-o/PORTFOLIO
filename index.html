<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Yang Ye Hyun portfolio" />

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https://yehyun-portfolio-api.ajas03974.workers.dev; media-src 'self' https://yehyun-portfolio-api.ajas03974.workers.dev; connect-src 'self' https://yehyun-portfolio-api.ajas03974.workers.dev;"
    />

    <title>YeHyun's Portfolio</title>

    <link
      rel="shortcut icon"
      href="img/favicon-96x96.png"
      type="image/x-icon"
    />

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="globals.css" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- bootstrap default -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
    />
    <!-- bootstrap css -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    />
    <!-- bootstrap js -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- bootstrap icon -->

    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  </head>

  <body>
    <!-- #로딩 스크린 영역 // start -->
    <div class="loading-wrap">
      <div id="loader">
        <div class="loader-content">
          <div class="title-row">
            <!-- portfolio에 하이라이트 컨테이너 감싸기 -->
            <span class="highlight-container">
              <span id="portfolio-word">PORTFOLIO</span>
            </span>
            <span id="year-word">2026</span>
          </div>
          <div class="subtitle-row">
            <p>Yang Ye Hyun</p>
            <div></div>
            <p>visual designer / portfolio</p>
          </div>
        </div>
      </div>
    </div>
    <!-- #로딩 스크린 영역 // end -->

    <!-- #main web site 영역 // start -->
    <div id="main-content">
      <!-- #header // start -->
      <header class="gnb">
        <!-- 로고 -->
        <button class="logo-btn" date-round="main" aria-label="YeHyun home">
          <a href="index.html">
            <img src="img/yehyun_logo.png" alt="yehyun logo" />
          </a>
        </button>

        <!-- gnb menu -->
        <nav aria-label="Portfolio categorys">
          <button><a href="ux/ui.html">UX/UI</a></button>
          <button><a href="graphic.html">Graphic</a></button>
          <button><a href="video.html">Video</a></button>
          <button><a href="#community">Community</a></button>
          <button><a href="#contact">Contact</a></button>
        </nav>

        <!-- gnb tools -->
        <div class="gnb-tool" aria-label="Site tools">
          <button
            class="gnb-tool"
            id="theme-toggle"
            data-action="toggle-theme"
            aria-label="Toggle light/dark theme"
          >
            <i class="bi bi-sun"></i>
          </button>
          <button
            class="gnb-tool gnb-admin-tool"
            id="admin-login-btn"
            data-action="admin-login"
            aria-label="Admin login"
          >
            <i class="bi bi-lock"></i>
          </button>

          <!-- admin session tools -->
          <div class="admin-session-tools" id="admin-session-tools" hidden>
            <button
              class="gnb-tool notification-tool"
              data-action="notifications"
              aria-label="알림 센터"
            >
              <i class="bi bi-bell" aria-hidden="true"></i
              ><span class="notification-count" id="notification-count" hidden
                >0</span
              >
            </button>
            <button class="gnb-tool" data-action="settings">
              <i class="bi bi-gear" aria-hidden="true"></i
              ><span class="visually-hidden">설정</span>
            </button>
            <button class="gnb-tool" data-action="admin-logout">
              로그아웃
            </button>
          </div>
          <!-- admin session tools end -->
        </div>
        <!-- gnb tools end -->

        <div class="notification-center" id="notification-center" hidden>
          <div class="notification-center-heading">
            <strong>알림 센터</strong
            ><button
              class="btn-close"
              data-action="close-notifications"
              aria-label="알림 닫기"
              type="button"
            ></button>
          </div>
          <ol class="notification-list" id="notification-list">
            <li class="empty-state">알림을 불러오는 중입니다.</li>
          </ol>
        </div>
      </header>
      <!-- #header // end -->

      <!-- #main // start -->
      <div id="main"></div>
      <!-- #main // end -->

      <!-- #footer // start -->
      <div id="footer"></div>
      <!-- #footer // end -->
      <!-- #main web site 영역 // end -->
    </div>



    <!-- ============================= -->
    <!-- index.js -->
    <script src="src/index.js"></script>
    
    <!-- #bootsrtap script // start -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
      integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
      integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
      crossorigin="anonymous"
    ></script>
    <!-- #bootsrtap script // end -->
  </body>
</html>
